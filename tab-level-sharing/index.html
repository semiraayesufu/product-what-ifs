<title>Tab-Level Sharing</title>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">

<style>
  /* ===== Tokens: Google Workspace blue ===== */
  :root{
    --primary:#1a73e8;
    --on-primary:#ffffff;
    --primary-hover:#1765cc;
    --primary-soft:#e8f0fe;
    --on-primary-soft:#1a73e8;
    --success:#1e8e3e;
    --success-soft:#e6f4ea;
    --surface:#ffffff;
    --surface-container:#f8f9fa;
    --surface-container-high:#ffffff;
    --border:#dadce0;
    --border-strong:#c4c7cc;
    --text:#202124;
    --text-secondary:#5f6368;
    --text-tertiary:#80868b;
    --warn:#b06000;
    --warn-soft:#fef7e0;
    --error:#c5221f;
    --error-soft:#fce8e6;
    --demo-bg:#fff8e1;
    --demo-border:#e8d48a;
    --demo-text:#7a5c00;
    --comment-highlight:#fef3c0;
    --scrim:rgba(32,33,36,.55);
    --shadow-1:0 1px 2px rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
    --shadow-2:0 1px 3px rgba(60,64,67,.3), 0 4px 8px 3px rgba(60,64,67,.15);
    --shadow-3:0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);
    --paper-shadow:0 1px 3px rgba(60,64,67,.15), 0 4px 12px rgba(60,64,67,.1);
    --radius-xs:6px; --radius-sm:8px; --radius-md:12px; --radius-lg:20px; --radius-full:999px;
    --font-ui:'Roboto',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    --font-doc:Arial,'Helvetica Neue',Helvetica,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --primary:#8ab4f8; --on-primary:#062e6f; --primary-hover:#aecbfa; --primary-soft:#28323f; --on-primary-soft:#8ab4f8;
      --success:#81c995; --success-soft:#1e2e21;
      --surface:#202124; --surface-container:#292a2d; --surface-container-high:#2d2e30;
      --border:#3c4043; --border-strong:#5f6368;
      --text:#e8eaed; --text-secondary:#9aa0a6; --text-tertiary:#80868b;
      --warn:#fdd663; --warn-soft:#3a341f; --error:#f28b82; --error-soft:#3a2725;
      --demo-bg:#332b12; --demo-border:#5c4b19; --demo-text:#e8d48a;
      --comment-highlight:rgba(255,214,79,.22);
      --scrim:rgba(0,0,0,.6);
      --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
      --shadow-2:0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
      --shadow-3:0 4px 10px 3px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
      --paper-shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --primary:#8ab4f8; --on-primary:#062e6f; --primary-hover:#aecbfa; --primary-soft:#28323f; --on-primary-soft:#8ab4f8;
    --success:#81c995; --success-soft:#1e2e21;
    --surface:#202124; --surface-container:#292a2d; --surface-container-high:#2d2e30;
    --border:#3c4043; --border-strong:#5f6368;
    --text:#e8eaed; --text-secondary:#9aa0a6; --text-tertiary:#80868b;
    --warn:#fdd663; --warn-soft:#3a341f; --error:#f28b82; --error-soft:#3a2725;
    --demo-bg:#332b12; --demo-border:#5c4b19; --demo-text:#e8d48a;
    --comment-highlight:rgba(255,214,79,.22);
    --scrim:rgba(0,0,0,.6);
    --shadow-1:0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.3);
    --shadow-2:0 1px 3px rgba(0,0,0,.5), 0 4px 8px 3px rgba(0,0,0,.3);
    --shadow-3:0 4px 10px 3px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
    --paper-shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--surface); color:var(--text); font-family:var(--font-ui);
    font-size:14px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  button, input, select{ font-family:inherit; font-size:inherit; color:inherit; }
  button{ -webkit-tap-highlight-color:transparent; }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; border-radius:4px; }
  h1,h2,h3{ text-wrap:balance; }

  .material-symbols-outlined{
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;
    font-size:20px; line-height:1; display:inline-block; user-select:none; flex-shrink:0;
  }
  .filled{ font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 20; }

  .app{ display:flex; flex-direction:column; height:100vh; min-height:600px; }
  .app-shell{ display:flex; flex-direction:column; height:100vh; min-height:600px; }
  #ownerView[hidden], #recipientView[hidden]{ display:none; }

  /* ===== Recipient page (separate workflow: what a tab guest lands on) ===== */
  .recipient-badge{ background:var(--demo-bg); color:var(--demo-text); border:1px solid var(--demo-border); font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px; text-transform:uppercase; letter-spacing:.05em; flex-shrink:0; }
  .recipient-shell{ min-height:100vh; display:flex; flex-direction:column; background:var(--surface-container); }
  .recipient-topbar{ display:flex; align-items:center; gap:14px; padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--border); flex-wrap:wrap; flex-shrink:0; }
  .recipient-back{ display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--text-secondary); font-size:13px; cursor:pointer; padding:8px 12px; border-radius:var(--radius-full); flex-shrink:0; }
  .recipient-back:hover{ background:color-mix(in srgb, var(--text) 6%, transparent); color:var(--text); }
  .recipient-doc-meta{ display:flex; flex-direction:column; min-width:0; }
  .recipient-doc-title{ font-size:13px; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recipient-spacer{ flex:1 1 auto; }
  .recipient-person{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); flex-shrink:0; }
  .recipient-tabswitch{ display:flex; gap:8px; padding:14px 24px 0; flex-wrap:wrap; background:var(--surface-container); flex-shrink:0; }
  .recipient-tabswitch button{ border:1px solid var(--border); background:var(--surface); color:var(--text-secondary); border-radius:var(--radius-full); padding:8px 16px; font-size:13px; cursor:pointer; }
  .recipient-tabswitch button:hover{ background:color-mix(in srgb, var(--text) 5%, transparent); }
  .recipient-tabswitch button.active{ background:var(--primary-soft); color:var(--on-primary-soft); border-color:transparent; font-weight:500; }
  .recipient-noaccess{ padding:80px 24px; text-align:center; color:var(--text-secondary); font-size:14px; }
  #recipientToolbarWrap .menu-row{ padding-left:20px; }

  /* ===== Icon button ===== */
  .icon-btn{
    position:relative; width:40px; height:40px; border-radius:50%; border:none; background:none;
    color:var(--text-secondary); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:hover{ background:color-mix(in srgb, currentColor 8%, transparent); }
  .icon-btn:active{ background:color-mix(in srgb, currentColor 12%, transparent); }
  .icon-btn.sm{ width:34px; height:34px; }
  .icon-btn.on{ color:var(--primary); background:var(--primary-soft); }
  .icon-btn:disabled{ opacity:.38; cursor:not-allowed; }
  .icon-btn:disabled:hover{ background:none; }

  /* ===== Buttons ===== */
  .btn{
    position:relative; font-family:inherit; font-size:14px; font-weight:500; letter-spacing:.01em;
    height:40px; padding:0 24px; border-radius:var(--radius-full); border:1px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
  }
  .btn .material-symbols-outlined{ font-size:18px; }
  .btn:disabled{ opacity:.38; cursor:not-allowed; }
  .btn-filled{ background:var(--primary); color:var(--on-primary); }
  .btn-filled:hover:not(:disabled){ background:var(--primary-hover); box-shadow:var(--shadow-1); }
  .btn-tonal{ background:var(--primary-soft); color:var(--on-primary-soft); }
  .btn-tonal:hover:not(:disabled){ background:color-mix(in srgb, var(--primary-soft) 85%, var(--primary) 15%); }
  .btn-outlined{ background:transparent; color:var(--text); border-color:var(--border-strong); padding:0 23px; }
  .btn-outlined:hover:not(:disabled){ background:color-mix(in srgb, var(--text) 6%, transparent); }
  .btn-outlined-primary{ background:transparent; color:var(--primary); border-color:var(--border-strong); padding:0 20px; }
  .btn-outlined-primary:hover:not(:disabled){ background:color-mix(in srgb, var(--primary) 8%, transparent); }
  .btn-text{ background:none; color:var(--primary); padding:0 12px; height:36px; }
  .btn-text:hover:not(:disabled){ background:color-mix(in srgb, var(--primary) 8%, transparent); }

  .split-btn{ display:flex; align-items:stretch; }
  .split-btn .btn-filled{ border-radius:var(--radius-full) 0 0 var(--radius-full); padding:0 16px 0 20px; }
  .split-btn .split-chev{
    border-radius:0 var(--radius-full) var(--radius-full) 0; background:var(--primary); color:var(--on-primary);
    width:34px; height:40px; border:none; border-left:1px solid color-mix(in srgb, var(--on-primary) 30%, transparent);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .split-btn .split-chev:hover{ background:var(--primary-hover); }
  .split-btn .split-chev .material-symbols-outlined{ font-size:18px; }

  /* ===== Top chrome ===== */
  .topbar{ background:var(--surface); flex-shrink:0; }
  .tb-row1{ display:flex; align-items:center; gap:2px; padding:8px 12px 2px; }
  .doc-icon{ width:32px; height:32px; border-radius:var(--radius-sm); background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-right:8px; }
  .doc-icon .material-symbols-outlined{ font-size:19px; }
  .doc-meta{ display:flex; flex-direction:column; min-width:0; margin-right:4px; }
  .doc-title{
    font-size:18px; font-weight:400; border:1px solid transparent; background:none; color:var(--text);
    padding:3px 8px; border-radius:var(--radius-xs); max-width:320px;
  }
  .doc-title:hover:not(:disabled){ background:color-mix(in srgb, var(--text) 6%, transparent); }
  .doc-title:disabled{ color:var(--text); opacity:1; }
  .tb1-spacer{ flex:1 1 auto; }
  .md-select{
    appearance:none; -webkit-appearance:none;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:var(--radius-xs); padding:7px 30px 7px 12px; cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24'><path d='M7 10l5 5 5-5z' fill='%235f6368'/></svg>");
    background-repeat:no-repeat; background-position:right 4px center;
  }
  .avatar{
    width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:600; color:#fff; flex-shrink:0;
  }
  .tb1-actions{ display:flex; align-items:center; gap:2px; margin-left:6px; }
  .upgrade-btn{ margin-left:10px; height:36px; padding:0 16px; }
  .account-avatar{ margin-left:14px; width:32px; height:32px; background:var(--primary); }

  .menu-row{ display:flex; gap:2px; padding:2px 20px 4px 52px; }
  .menu-btn2{ background:none; border:none; color:var(--text); font-size:13px; padding:6px 10px; border-radius:var(--radius-xs); cursor:pointer; }
  .menu-btn2:hover{ background:color-mix(in srgb, var(--text) 6%, transparent); }

  .toolbar-wrap{ border-bottom:1px solid var(--border); }
  .toolbar{ display:flex; align-items:center; gap:2px; padding:4px 12px; overflow-x:auto; scrollbar-width:thin; }
  .toolbar.collapsed{ display:none; }
  .tb-search{
    display:flex; align-items:center; gap:8px; color:var(--text-secondary); background:var(--surface-container);
    border-radius:var(--radius-full); padding:6px 14px 6px 10px; font-size:12.5px; flex-shrink:0; cursor:pointer; border:none;
  }
  .tb-search .material-symbols-outlined{ font-size:18px; }
  .tb-div{ width:1px; height:24px; background:var(--border); margin:0 6px; flex-shrink:0; }
  .zoom-select{ font-size:12.5px; padding:6px 26px 6px 10px; }
  .style-select{ font-size:12.5px; padding:6px 26px 6px 10px; max-width:110px; }
  .font-select{ font-size:12.5px; padding:6px 26px 6px 10px; max-width:100px; }
  .size-stepper{ display:flex; align-items:center; gap:2px; flex-shrink:0; }
  .size-field{ width:32px; text-align:center; border:1px solid var(--border); border-radius:var(--radius-xs); padding:6px 2px; background:var(--surface); }
  .tb-right{ margin-left:auto; display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .editing-select{ font-size:12.5px; padding:7px 30px 7px 14px; }

  /* ===== Body layout ===== */
  .body{ display:flex; flex:1 1 auto; min-height:0; position:relative; }
  .rail{
    width:280px; flex-shrink:0; background:var(--surface-container);
    border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0;
  }
  .rail-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px; color:var(--text-secondary); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }

  .tab-list{ list-style:none; margin:0; padding:0 12px; overflow-y:auto; flex:1 1 auto; display:flex; flex-direction:column; gap:2px; }
  .tab-row{ position:relative; display:flex; align-items:center; gap:10px; padding:10px 8px 10px 14px; border-radius:var(--radius-sm); cursor:pointer; }
  .tab-row:hover{ background:color-mix(in srgb, var(--text) 6%, transparent); }
  .tab-row.active{ background:var(--primary-soft); }
  .tab-row.active .tab-name{ color:var(--primary); font-weight:500; }
  .tab-row.is-subtab{ padding-left:34px; }
  .tab-emoji{ width:16px; text-align:center; font-size:15px; line-height:1; flex-shrink:0; }
  .tab-name{ flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; color:var(--text); }
  .tab-name-input{ flex:1 1 auto; min-width:0; border:1px solid var(--primary); border-radius:6px; padding:3px 8px; background:var(--surface); color:var(--text); font-size:13.5px; }
  .tab-badge{ flex-shrink:0; display:flex; align-items:center; color:var(--primary); }
  .tab-badge .material-symbols-outlined{ font-size:17px; }
  .tab-kebab{ flex-shrink:0; opacity:0; }
  .tab-row:hover .tab-kebab, .tab-row.menu-open .tab-kebab{ opacity:1; }

  .add-tab-row{
    margin:2px 12px 14px; background:none; border:none; color:var(--text-secondary);
    border-radius:var(--radius-sm); padding:8px 8px 8px 14px; cursor:pointer; display:flex; align-items:center; gap:10px; font-size:13.5px;
    width:calc(100% - 24px);
  }
  .add-tab-row .material-symbols-outlined{ font-size:19px; }
  .add-tab-row:hover:not(:disabled){ background:color-mix(in srgb, var(--text) 6%, transparent); color:var(--text); }

  /* menu popover */
  .popover{ position:absolute; z-index:40; min-width:200px; background:var(--surface-container-high); border-radius:var(--radius-sm); box-shadow:var(--shadow-2); padding:8px; }
  .popover-item{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 12px; border-radius:6px; background:none; border:none; cursor:pointer; font-size:13.5px; color:var(--text); }
  .popover-item:hover{ background:color-mix(in srgb, var(--text) 8%, transparent); }
  .popover-item.danger{ color:var(--error); }
  .popover-item .material-symbols-outlined{ font-size:19px; color:var(--text-secondary); }
  .popover-item.danger .material-symbols-outlined{ color:var(--error); }
  .popover-item .chev{ margin-left:auto; color:var(--text-tertiary); font-size:18px; }
  .popover-divider{ height:1px; background:var(--border); margin:6px 4px; }
  .emoji-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:2px; }
  .emoji-btn{ font-size:19px; line-height:1; padding:8px 0; border-radius:6px; background:none; border:none; cursor:pointer; }
  .emoji-btn:hover{ background:color-mix(in srgb, var(--text) 8%, transparent); }

  /* ===== Canvas / paper ===== */
  .canvas{ flex:1 1 auto; overflow-y:auto; padding:40px 24px 100px; display:flex; justify-content:center; min-width:0; }
  .doc-with-margin{ display:flex; align-items:flex-start; gap:28px; }
  .page-scale{ transform-origin:top center; }
  .page{ width:680px; max-width:100%; background:var(--surface); box-shadow:var(--paper-shadow); border-radius:2px; padding:56px 64px; font-family:var(--font-doc); color:var(--text); line-height:1.65; }
  .page h2{ font-size:23px; margin:0 0 4px; font-weight:700; }
  .page .doc-kicker{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-secondary); font-family:var(--font-ui); font-weight:600; margin-bottom:6px; }
  .page p{ margin:0 0 14px; font-size:14.5px; max-width:65ch; }
  .page ul{ margin:0 0 14px; padding-left:22px; }
  .page li{ margin-bottom:6px; font-size:14.5px; }
  .page .access-note{ display:flex; gap:10px; align-items:flex-start; font-family:var(--font-ui); font-size:12.5px; border-radius:var(--radius-md); padding:12px 14px; margin:0 0 22px; background:var(--primary-soft); color:var(--on-primary-soft); }
  .page .access-note .material-symbols-outlined{ font-size:19px; margin-top:1px; }
  .table-wrap{ overflow-x:auto; margin:0 0 16px; }
  table.budget{ border-collapse:collapse; width:100%; font-size:13.5px; font-family:var(--font-ui); min-width:420px; }
  table.budget th, table.budget td{ text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); }
  table.budget td.num, table.budget th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  table.budget th{ color:var(--text-secondary); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; }
  table.budget tr:last-child td{ font-weight:700; border-bottom:none; }

  .doc-body[contenteditable="true"]{ border-radius:var(--radius-sm); outline:2px dashed transparent; transition:outline-color .15s ease; margin:0 -8px; padding:0 8px; }
  .doc-body[contenteditable="true"]:hover{ outline-color:var(--border-strong); }
  .doc-body[contenteditable="true"]:focus{ outline-color:var(--primary); outline-style:solid; }

  /* ===== Comments: inline highlight + margin cards (matches Google Docs) ===== */
  .comment-highlight{ background:var(--comment-highlight); border-radius:2px; cursor:pointer; }
  .comment-fab{
    position:fixed; z-index:150; width:36px; height:36px; border-radius:50%;
    background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-secondary);
  }
  .comment-fab:hover{ background:var(--primary-soft); color:var(--primary); }
  .comment-margin{ width:260px; flex-shrink:0; font-family:var(--font-ui); }
  .comment-margin-inner{ position:relative; }
  .comment-empty-margin{ font-size:12px; color:var(--text-tertiary); line-height:1.5; padding:2px 4px; }
  .comment-card{
    position:absolute; left:0; right:0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-sm); box-shadow:var(--shadow-1); padding:12px 14px; transition:top .15s ease, box-shadow .15s ease;
  }
  .comment-card.flash{ box-shadow:0 0 0 2px var(--primary); }
  .comment-card-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .comment-card-name{ font-size:12.5px; font-weight:600; }
  .comment-card-time{ font-size:11px; color:var(--text-tertiary); margin-left:auto; }
  .comment-card-text{ font-size:13px; line-height:1.5; color:var(--text); white-space:pre-wrap; }
  .comment-composer textarea{
    width:100%; border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:13px;
    font-family:inherit; resize:vertical; min-height:52px; color:var(--text); background:var(--surface);
  }
  .comment-composer textarea:focus{ border-color:var(--primary); }
  .comment-composer-actions{ display:flex; justify-content:flex-end; gap:6px; margin-top:8px; }
  .comment-composer-actions .btn{ height:32px; padding:0 14px; font-size:13px; }
  @media (max-width: 960px){
    .comment-margin{ display:none; }
    .comment-fab{ display:none; }
  }

  /* ===== Modal ===== */
  .overlay{ position:fixed; inset:0; background:var(--scrim); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--surface-container-high); border-radius:var(--radius-lg); box-shadow:var(--shadow-3); width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
  .modal-head{ padding:24px 24px 4px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .modal-head h3{ margin:0; font-size:22px; font-weight:400; color:var(--text); }
  .modal-head-actions{ display:flex; gap:2px; margin-top:-6px; }
  .modal-body{ padding:16px 24px; overflow-y:auto; }

    const idx = state.tabs.findIndex(t=>t.id===id);

    }
    if(state.grants.some(g=>g.email===email && g.scope==='document')) return state.tabs.map(t=>t.id);
    return state.grants.filter(g=>g.email===email && g.scope!=='document').map(g=>g.scope);

  function accessFor(email, tabId){
    if(email==='__public__'){
      if(state.generalAccess.document.mode==='anyone') return {role: state.generalAccess.document.role, via:'document link'};

    const docGrant = state.grants.find(g=>g.email===email && g.scope==='document');
    if(docGrant) return {role:docGrant.role, via:'document'};
    const tabGrant = state.grants.find(g=>g.email===email && g.scope===tabId);
    if(tabGrant) return {role:tabGrant.role, via:'tab'};
    return null;
  }

  /* ---------- Page (content, access note, comments) ---------- */
  /* ---------- Comments: select text -> highlight + margin card (Google Docs style) ---------- */
  let pendingComment = null;

  function wrapRangeInHighlight(range, commentId){
    const root = range.commonAncestorContainer;
    const walkRoot = root.nodeType === 3 ? root.parentNode : root;
    const walker = document.createTreeWalker(walkRoot, NodeFilter.SHOW_TEXT, {
      acceptNode(node){ return range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
    });
    const nodes = [];
    let n;
    while(n = walker.nextNode()) nodes.push(n);

    nodes.forEach(node=>{
      const start = node === range.startContainer ? range.startOffset : 0;
      const end = node === range.endContainer ? range.endOffset : node.length;
      if(start >= end) return;
      const before = node.textContent.slice(0, start);
      const middle = node.textContent.slice(start, end);
      const after = node.textContent.slice(end);
      const span = document.createElement('span');
      span.className = 'comment-highlight';
      span.dataset.commentId = commentId;
      span.textContent = middle;
      const parent = node.parentNode;
      const afterNode = document.createTextNode(after);
      parent.replaceChild(afterNode, node);
      parent.insertBefore(span, afterNode);
      parent.insertBefore(document.createTextNode(before), span);
    });
  }

  function unwrapHighlight(pageEl, commentId){
    pageEl.querySelectorAll(`[data-comment-id="${commentId}"]`).forEach(span=>{
      const parent = span.parentNode;
      parent.replaceChild(document.createTextNode(span.textContent), span);
      parent.normalize();
    });
  }

  function removeCommentFab(){ document.getElementById('commentFab')?.remove(); }

  function showCommentFab(rect, range, meta){
    removeCommentFab();
    const btn = document.createElement('button');
    btn.id = 'commentFab';
    btn.className = 'comment-fab';
    btn.innerHTML = icon('add_comment', 18);
    btn.setAttribute('aria-label', 'Add comment');
    btn.style.top = Math.min(window.innerHeight - 44, rect.bottom + 8) + 'px';
    btn.style.left = Math.min(window.innerWidth - 44, Math.max(8, rect.right - 10)) + 'px';
    btn.addEventListener('mousedown', ev=> ev.preventDefault());
    btn.addEventListener('click', ()=>{
      startCommentComposer(range.cloneRange(), meta);
      removeCommentFab();
    });
    document.body.appendChild(btn);
  }

  function startCommentComposer(range, meta){
    if(pendingComment){
      unwrapHighlight(pendingComment.pageEl, pendingComment.id);
      pendingComment.tab.editedHtml = pendingComment.pageEl.querySelector('.doc-body').innerHTML;
    }
    const tempId = 'c-' + Math.random().toString(36).slice(2,9);
    wrapRangeInHighlight(range, tempId);
    meta.tab.editedHtml = meta.pageEl.querySelector('.doc-body').innerHTML;
    pendingComment = { id: tempId, tab: meta.tab, authorName: meta.authorName, pageEl: meta.pageEl, marginEl: meta.marginEl, canComment: meta.canComment };
    renderCommentMargin(meta.marginEl, meta.pageEl, meta.tab, meta.canComment);
  }

  function renderCommentMargin(marginEl, pageEl, tab, canComment){
    if(!marginEl) return;
    const comments = (tab.comments || []).slice();
    const items = comments.map(c=>({type:'comment', id:c.id, data:c}));
    if(pendingComment && pendingComment.tab === tab) items.push({type:'pending', id:pendingComment.id});

    if(!items.length){
      marginEl.innerHTML = canComment ? `<p class="comment-empty-margin">Select text in the document to leave a comment.</p>` : '';
      return;
    }

    const withPos = items.map(item=>{
      const span = pageEl.querySelector(`[data-comment-id="${item.id}"]`);
      return { item, top: span ? span.offsetTop : 0 };
    }).sort((a,b)=> a.top - b.top);

    marginEl.innerHTML = `<div class="comment-margin-inner">${withPos.map(({item})=>{
      if(item.type === 'pending'){
        return `<div class="comment-card comment-composer" data-comment-card="${item.id}" style="top:0px;">
          <textarea placeholder="Comment"></textarea>
          <div class="comment-composer-actions">
            <button class="btn btn-text" data-cancel-comment="${item.id}">Cancel</button>
            <button class="btn btn-filled" data-submit-comment="${item.id}">Comment</button>
          </div>
        </div>`;
      }
      const c = item.data;
      return `<div class="comment-card" data-comment-card="${item.id}" style="top:0px;">
        <div class="comment-card-head">
          <div class="avatar" style="width:22px;height:22px;font-size:10px;background:${colorFor(c.author)}">${initials(c.author)}</div>
          <span class="comment-card-name">${escapeHtml(c.author)}</span>
          <span class="comment-card-time">${escapeHtml(c.time)}</span>
        </div>
        <div class="comment-card-text">${escapeHtml(c.text)}</div>
      </div>`;
    }).join('')}</div>`;

    let cursor = 0, maxBottom = 0;
    withPos.forEach(({item, top})=>{
      const cardEl = marginEl.querySelector(`[data-comment-card="${item.id}"]`);
      const cardTop = Math.max(top, cursor);
      cardEl.style.top = cardTop + 'px';
      cursor = cardTop + cardEl.offsetHeight + 12;
      maxBottom = Math.max(maxBottom, cardTop + cardEl.offsetHeight);
    });
    marginEl.querySelector('.comment-margin-inner').style.minHeight = maxBottom + 'px';

    const composerEl = marginEl.querySelector('.comment-composer');
    if(composerEl){
      const ta = composerEl.querySelector('textarea');
      requestAnimationFrame(()=> ta.focus());
      marginEl.querySelector('[data-submit-comment]').onclick = ()=>{
        const text = ta.value.trim();
        if(!text) return;
        tab.comments = tab.comments || [];
        tab.comments.push({id: pendingComment.id, author: pendingComment.authorName, text, time:'Just now'});
        pendingComment = null;
        renderCommentMargin(marginEl, pageEl, tab, canComment);
      };
      marginEl.querySelector('[data-cancel-comment]').onclick = ()=>{
        unwrapHighlight(pageEl, pendingComment.id);
        tab.editedHtml = pageEl.querySelector('.doc-body').innerHTML;
        pendingComment = null;
        renderCommentMargin(marginEl, pageEl, tab, canComment);
      };
    }
  }

  document.addEventListener('mousedown', (e)=>{
    if(!e.target.closest || !e.target.closest('#commentFab')) removeCommentFab();
  });

  document.addEventListener('mouseup', (e)=>{
    setTimeout(()=>{
      const sel = window.getSelection();
      removeCommentFab();
      if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
      const range = sel.getRangeAt(0);
      if(range.collapsed) return;
      const anchorNode = range.commonAncestorContainer;
      const anchorEl = anchorNode.nodeType === 1 ? anchorNode : anchorNode.parentElement;
      const docBodyEl = anchorEl ? anchorEl.closest('.doc-body') : null;
      if(!docBodyEl || !docBodyEl.__commentMeta || !docBodyEl.__commentMeta.canComment) return;
      const rect = range.getBoundingClientRect();
      if(!rect || (rect.width === 0 && rect.height === 0)) return;
      showCommentFab(rect, range, docBodyEl.__commentMeta);
    }, 0);
  });

  document.addEventListener('click', (e)=>{
    const hl = e.target.closest && e.target.closest('.comment-highlight');
    if(hl){
      const card = document.querySelector(`[data-comment-card="${hl.dataset.commentId}"]`);
      if(card){
        card.scrollIntoView({block:'nearest', behavior:'smooth'});
        card.classList.add('flash');
        setTimeout(()=> card.classList.remove('flash'), 900);
      }
    }
  });

  function buildTabContentHtml(tab, access, mode){
    const c = tab.content;
    const canEdit = access.role === 'Owner' || access.role === 'Editor';
    const canComment = access.role === 'Owner' || access.role === 'Editor' || access.role === 'Commenter';

    let noteHtml = '';
    if(mode !== 'recipient'){
      const tabGrants = grantsForScope(tab.id);
      const ga = state.generalAccess[tab.id];
      if(tabGrants.length || ga.mode==='anyone'){
        const names = tabGrants.map(g=>`${g.name} (${g.role})`).join(', ');
        const linkBit = ga.mode==='anyone' ? `Anyone with the tab link can ${ga.role.toLowerCase()}.` : '';
        noteHtml = `<div class="access-note">${icon('link',19)}<span>This tab is individually shared${names?` with <strong>${escapeHtml(names)}</strong>`:''}. ${linkBit} They can't see the other tabs.</span></div>`;
      }
    }

    const bodyHtml = tab.editedHtml != null ? tab.editedHtml : c.body.map(block=>{
      if(block.p) return `<p>${block.p}</p>`;
      if(block.ul) return `<ul>${block.ul.map(li=>`<li>${li}</li>`).join('')}</ul>`;
      if(block.table){
        const t = block.table;
        return `<div class="table-wrap"><table class="budget">
          <thead><tr>${t.headers.map((h,i)=>`<th class="${i===t.headers.length-1?'num':''}">${h}</th>`).join('')}</tr></thead>
          <tbody>${t.rows.map(r=>`<tr>${r.map((cell,i)=>`<td class="${i===r.length-1?'num':''}">${cell}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>`;
      }
      return '';
    }).join('');

    return `
      <div class="doc-kicker">${c.kicker}</div>
      <h2>${escapeHtml(c.title)}</h2>
      <div style="height:14px"></div>
      ${noteHtml}
      <div class="doc-body" contenteditable="${canEdit}" spellcheck="false">${bodyHtml}</div>
    `;
  }

  function wireTabContentEvents(pageEl, marginEl, tab, access){
    const canComment = access.role === 'Owner' || access.role === 'Editor' || access.role === 'Commenter';
    const authorName = access.role === 'Owner' ? OWNER.name : (personsList().find(p=>p.email===state.previewAs)||{}).name || 'Guest';
    const docBody = pageEl.querySelector('.doc-body');
    docBody.addEventListener('input', (e)=>{ tab.editedHtml = e.currentTarget.innerHTML; });
    docBody.__commentMeta = { tab, canComment, authorName, pageEl, marginEl };
    renderCommentMargin(marginEl, pageEl, tab, canComment);
  }

  function showRecipientView(email, preferredTab){
    document.getElementById('ownerView').hidden = true;
    document.getElementById('recipientView').hidden = false;
    state.previewAs = email;
    const vis = visibleTabsFor(email);
    const noAccessEl = document.getElementById('recipientNoAccess');
    const canvasEl = document.getElementById('recipientCanvasWrap');
    const switchEl = document.getElementById('recipientTabSwitch');
    renderRecipientHeader(email);
    if(!vis.length){
      noAccessEl.hidden = false;
      canvasEl.hidden = true;
      switchEl.style.display = 'none';
      document.getElementById('recipientToolbarWrap').innerHTML = '';
      return;
    }
    noAccessEl.hidden = true;
    canvasEl.hidden = false;
    if(preferredTab && vis.includes(preferredTab)) state.recipientActiveTabId = preferredTab;
    else if(!state.recipientActiveTabId || !vis.includes(state.recipientActiveTabId)) state.recipientActiveTabId = vis[0];
    renderRecipientTabSwitch(email);
    renderRecipientPage();
  }

  function goToRecipientView(email, preferredTab){
    location.hash = 'recipient/' + encodeURIComponent(email) + (preferredTab ? '/' + encodeURIComponent(preferredTab) : '');
    applyRoute();
  }

  function applyRoute(){
    const hash = location.hash.replace(/^#\/?/, '');
    if(hash.startsWith('recipient/')){
      const parts = hash.slice('recipient/'.length).split('/').map(decodeURIComponent);
      showRecipientView(parts[0], parts[1]);
    } else {
      showOwnerView();
    }
  }

  /* ---------- Toast ---------- */
  let toastTimer = null;
  function showToast(msg, actionLabel, actionFn){
    clearTimeout(toastTimer);
    el.toastMsg.textContent = msg;
    if(actionLabel){
      el.toastAction.style.display = 'inline';
      el.toastAction.textContent = actionLabel;
      el.toastAction.onclick = ()=>{ el.toast.classList.remove('show'); if(actionFn) actionFn(); };
    } else {
      el.toastAction.style.display = 'none';
      el.toastAction.onclick = null;
    }
    el.toast.classList.add('show');
    toastTimer = setTimeout(()=> el.toast.classList.remove('show'), 6000);
  }

  function copyToClipboard(text){
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text));
      } else { fallbackCopy(text); }
    }catch(e){ fallbackCopy(text); }
  }
  function fallbackCopy(text){
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){}
  }

  /* ---------- Unified share modal (WHO + SCOPE + ROLE) ---------- */
  function scopeOptions(){
    return [{value:'document', label:'Entire document'}, ...state.tabs.map(t=>({value:t.id, label:t.name}))];
  }
  function scopeLabel(scope){ return scope==='document' ? DOC_TITLE : ((getTab(scope)||{}).name || scope); }

  function openShareModal(scope){
    closeTabMenu();
    renderShareModal([scope]);
    el.overlay.classList.add('open');
  }

  function buildUnionPeople(scopes){
    const map = new Map();
    scopes.forEach(scope=>{
      grantsForScope(scope).forEach(g=>{
        if(!map.has(g.email)) map.set(g.email, {name:g.name, email:g.email, entries:[]});
        map.get(g.email).entries.push({scope, label:scopeLabel(scope), role:g.role, id:g.id});
      });
    });
    return [...map.values()];
  }

  function closeTabSelectMenu(){ document.getElementById('tabSelectMenu')?.remove(); }

  function tabCheckRowHtml(o, checked){
    return `<button type="button" class="tab-check-row" data-tab-option="${o.value}">
      <span class="tab-checkbox ${checked?'checked':''}">${checked?icon('check',13):''}</span>${escapeHtml(o.label)}
    </button>`;
  }

  function renderTabSelectMenuBody(scopes, query){
    const pop = document.getElementById('tabSelectMenu');
    if(!pop) return;
    const all = scopeOptions();
    const selectedOpts = all.filter(o=>scopes.includes(o.value));
    const q = query.trim().toLowerCase();
    const filtered = q ? all.filter(o=>o.label.toLowerCase().includes(q)) : all;

    pop.innerHTML = `
      <div class="tab-search">${icon('search',18)}<input type="text" id="tabSearchInput" placeholder="Search tabs…" value="${escapeAttr(query)}" /></div>
      <div class="tab-check-list">
        ${selectedOpts.length ? selectedOpts.map(o=>tabCheckRowHtml(o,true)).join('') + '<div class="popover-divider"></div>' : ''}
        ${filtered.length ? filtered.map(o=>tabCheckRowHtml(o, scopes.includes(o.value))).join('') : `<div class="tab-select-empty">No tabs found.</div>`}
      </div>
    `;

    pop.querySelectorAll('[data-tab-option]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        const val = btn.dataset.tabOption;
        let next;
        if(val === 'document') next = ['document'];
        else if(scopes.includes('document')) next = [val];
        else if(scopes.includes(val)){ next = scopes.filter(s=>s!==val); if(next.length===0) next=[val]; }
        else next = [...scopes, val];
        renderShareModal(next);
        renderTabSelectMenuBody(next, document.getElementById('tabSearchInput') ? document.getElementById('tabSearchInput').value : '');
      };
    });
    const searchInput = document.getElementById('tabSearchInput');
    searchInput.oninput = ()=> renderTabSelectMenuBody(scopes, searchInput.value);
    if(query){ searchInput.focus(); searchInput.setSelectionRange(query.length, query.length); }
  }

  function openTabSelectMenu(scopes){
    closeTabSelectMenu();
    const box = document.getElementById('tabSelectBox');
    const rect = box.getBoundingClientRect();
    const pop = document.createElement('div');
    pop.className = 'popover';
    pop.id = 'tabSelectMenu';
    document.body.appendChild(pop);
    pop.style.top = (rect.bottom + window.scrollY + 4) + 'px';
    pop.style.left = (rect.left + window.scrollX) + 'px';
    renderTabSelectMenuBody(scopes, '');
  }

  document.addEventListener('click', (e)=>{
    if(!document.getElementById('tabSelectMenu')) return;
    if(e.target.closest('#tabSelectMenu') || e.target.closest('#tabSelectBox')) return;
    closeTabSelectMenu();
  });

  function renderShareModal(scopes){
    const isMulti = scopes.length > 1;

    let peopleSectionHtml;
    if(!isMulti){
      const scope = scopes[0];
      const grants = grantsForScope(scope);
      const inherited = scope!=='document' ? grantsForScope('document') : [];

      const ownerRow = `
        <div class="person-row">
          <div class="avatar" style="background:${colorFor(OWNER.email)}">${initials(OWNER.name)}</div>
          <div class="person-info">
            <div class="person-name">${escapeHtml(OWNER.name)} (you)</div>
            <div class="person-email">${escapeHtml(OWNER.email)}</div>
          </div>
          <span class="role-static">Owner</span>
        </div>`;

      const inheritedHtml = inherited.map(g=>`
        <div class="person-row">
          <div class="avatar" style="background:${colorFor(g.email)}">${initials(g.name)}</div>
          <div class="person-info">
            <div class="person-name">${escapeHtml(g.name)}</div>
            <div class="person-email">${escapeHtml(g.email)}</div>
          </div>
          <span class="role-static">${g.role} · Entire document</span>
        </div>`).join('');

      const grantsHtml = grants.map(g=>`
        <div class="person-row">
          <div class="avatar" style="background:${colorFor(g.email)}">${initials(g.name)}</div>
          <div class="person-info">
            <div class="person-name">${escapeHtml(g.name)}</div>
            <div class="person-email">${escapeHtml(g.email)}</div>
          </div>
          <select class="md-select role-select" data-grant-id="${g.id}">
            <option ${g.role==='Viewer'?'selected':''}>Viewer</option>
            <option ${g.role==='Commenter'?'selected':''}>Commenter</option>
            <option ${g.role==='Editor'?'selected':''}>Editor</option>
          </select>
          <button class="icon-btn sm person-remove" data-remove-grant="${g.id}" aria-label="Remove">${icon('close',18)}</button>
        </div>`).join('');

      peopleSectionHtml = `
        <div class="section-head">People with access</div>
        <div class="people-list" id="peopleList">${ownerRow}${inheritedHtml}${grantsHtml}</div>
      `;
    } else {
      const people = buildUnionPeople(scopes);
      const peopleHtml = people.map(p=>{
        const tags = p.entries.map(e=>`<span class="person-tag">${escapeHtml(e.label)} · ${e.role}</span>`).join('');
        return `
        <div class="person-row">
          <div class="avatar" style="background:${colorFor(p.email)}">${initials(p.name)}</div>
          <div class="person-info">
            <div class="person-name">${escapeHtml(p.name)}</div>
            <div class="person-email">${escapeHtml(p.email)}</div>
          </div>
          <button class="icon-btn sm" data-remove-union="${p.email}" aria-label="Remove">${icon('close',18)}</button>
          <div class="person-tags">${tags}</div>
        </div>`;
      }).join('') || `<p style="color:var(--text-secondary); font-size:13px; margin:4px 0 8px;">No one has access to these tabs yet.</p>`;

      peopleSectionHtml = `
        <div class="section-head">People with access to these tabs</div>
        <div class="people-list" id="peopleList">${peopleHtml}</div>
      `;
    }

    const generalAccessHtml = (()=>{
      if(isMulti) return '';
      const scope = scopes[0];
      const ga = state.generalAccess[scope];
      const linkOn = ga.mode === 'anyone';
      return `
        <div class="divider"></div>
        <div class="section-head">General access</div>
        <div class="access-block">
          <div class="access-icon ${linkOn?'on':''}">${linkOn ? icon('public',20) : icon('lock',20)}</div>
          <div class="access-copy">
            <select class="access-title-select" id="generalAccessSelect">
              <option value="restricted" ${!linkOn?'selected':''}>Restricted</option>
              <option value="anyone" ${linkOn?'selected':''}>Anyone with the link</option>
            </select>
            <div class="access-sub">${linkOn ? `Anyone on the internet with the link can ${ga.role.toLowerCase()}.` : 'Only people with access can open this.'}</div>
          </div>
          <select class="md-select access-select" id="generalRoleSelect" ${linkOn?'':'style="visibility:hidden;"'}>
            <option ${ga.role==='Viewer'?'selected':''}>Viewer</option>
            <option ${ga.role==='Commenter'?'selected':''}>Commenter</option>
            <option ${ga.role==='Editor'?'selected':''}>Editor</option>
          </select>
        </div>
      `;
    })();

    const footerHtml = isMulti
      ? `<div></div><button class="btn btn-filled" id="doneBtn">Done</button>`
      : `<button class="btn btn-outlined-primary" id="copyLinkBtn">${icon('link',18)} Copy link</button><button class="btn btn-filled" id="doneBtn">Done</button>`;

    el.modal.innerHTML = `
      <div class="modal-head">
        <h3>Share "${escapeHtml(DOC_TITLE)}"</h3>
        <div class="modal-head-actions">
          <button class="icon-btn" aria-label="Help">${icon('help')}</button>
          <button class="icon-btn" aria-label="Sharing settings">${icon('settings')}</button>
          <button class="icon-btn modal-close" id="modalCloseBtn" aria-label="Close">${icon('close')}</button>
        </div>
      </div>
      <div class="modal-body">
        <button type="button" class="tab-select-trigger" id="tabSelectBox">
          <span>Tab</span>
          <span class="tab-select-badge">${scopes.length}</span>
          ${icon('arrow_drop_down')}
        </button>
        <div class="field-row">
          <div class="text-field">
            <input type="email" id="addPersonInput" placeholder=" " />
            <label>Add people, groups, spaces, and calendar events</label>
          </div>
          <select class="md-select role-select-inline" id="addRoleSelect">
            <option selected>Viewer</option>
            <option>Commenter</option>
            <option>Editor</option>
          </select>
          <button class="btn btn-filled" id="addPersonBtn">Add</button>
        </div>
        ${peopleSectionHtml}
        ${generalAccessHtml}
      </div>
      <div class="modal-foot">${footerHtml}</div>
    `;

    document.getElementById('modalCloseBtn').onclick = ()=>{ closeTabSelectMenu(); closeModal(); };
    document.getElementById('doneBtn').onclick = ()=>{ closeTabSelectMenu(); closeModal(); };
    document.getElementById('tabSelectBox').addEventListener('click', (e)=>{
      e.stopPropagation();
      if(document.getElementById('tabSelectMenu')) closeTabSelectMenu();
      else openTabSelectMenu(scopes);
    });
    document.getElementById('addPersonBtn').onclick = ()=> addGrant(scopes);
    document.getElementById('addPersonInput').addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); addGrant(scopes); }
    });
    document.getElementById('generalAccessSelect')?.addEventListener('change', (e)=>{
      state.generalAccess[scopes[0]].mode = e.target.value;
      renderShareModal(scopes);
      renderTabs();
    });
    document.getElementById('generalRoleSelect')?.addEventListener('change', (e)=>{
      state.generalAccess[scopes[0]].role = e.target.value;
      renderShareModal(scopes);
    });
    document.getElementById('copyLinkBtn')?.addEventListener('click', ()=>{
      const scope = scopes[0];
      const url = scope==='document' ? 'https://docs.example/d/8f3k2q' : `https://docs.example/d/8f3k2q/tab/${scope}`;
      copyToClipboard(url);
      showToast('Link copied.');
    });
    el.modal.querySelectorAll('[data-remove-grant]').forEach(btn=>{
      btn.onclick = ()=>{
        state.grants = state.grants.filter(g=>g.id!==btn.dataset.removeGrant);
        renderShareModal(scopes);
        renderTabs();
      };
    });
    el.modal.querySelectorAll('[data-remove-union]').forEach(btn=>{
      btn.onclick = ()=>{
        const email = btn.dataset.removeUnion;
        const idsToRemove = new Set();
        scopes.forEach(scope=> grantsForScope(scope).filter(g=>g.email===email).forEach(g=>idsToRemove.add(g.id)));
        state.grants = state.grants.filter(g=>!idsToRemove.has(g.id));
        renderShareModal(scopes);
        renderTabs();
      };
    });
    el.modal.querySelectorAll('[data-grant-id]').forEach(sel=>{
      sel.onchange = ()=>{
        const g = state.grants.find(g=>g.id===sel.dataset.grantId);
        if(g){
          g.role = sel.value;
          const landingTab = scopes.find(s=>s!=='document');
          showToast(`${g.name} is now ${sel.value.toLowerCase()} on "${scopeLabel(scopes[0])}".`, 'Preview', ()=>{
            closeModal();
            goToRecipientView(g.email, landingTab);
          });
        }
      };
    });
  }

  function addGrant(scopes){
    const input = document.getElementById('addPersonInput');
    const roleSelect = document.getElementById('addRoleSelect');
    const val = input.value.trim();
    if(!val) return;
    if(!validEmail(val)){ showToast('Enter a valid email address.'); return; }
    const role = roleSelect.value;
    const name = deriveName(val);
    scopes.forEach(scope=>{
      const existing = state.grants.find(g=>g.email.toLowerCase()===val.toLowerCase() && g.scope===scope);
      if(existing) existing.role = role;
      else state.grants.push({id:'grant-'+Math.random().toString(36).slice(2,8), email:val, name, scope, role});
    });
    input.value = '';
    renderShareModal(scopes);
    renderTabs();
    const landingTab = scopes.find(s=>s!=='document');
    const label = scopes.length === 1 ? `"${scopeLabel(scopes[0])}"` : `${scopes.length} tabs`;
    showToast(`${name} was given ${role.toLowerCase()} access to ${label}.`, 'Preview', ()=>{
      closeModal();
      goToRecipientView(val, landingTab);
    });
  }

  function closeModal(){ el.overlay.classList.remove('open'); }

  /* ---------- Tab CRUD ---------- */
  function makeTab(name, parentId){
    const id = 'tab-' + Math.random().toString(36).slice(2,8);
    return {
      id, name, parentId: parentId||null, emoji:null, accent: colorFor(id), comments:[],
      content:{ kicker:`Section ${state.tabs.length+1}`, title:name, body:[{p:'Start writing this section — it isn’t shared with anyone until you choose to share it.'}] }
    };
  }
  function ensureGeneralAccessEntry(id){
    if(!state.generalAccess[id]) state.generalAccess[id] = {mode:'restricted', role:'Viewer'};
  }

  function addTab(){
    const tab = makeTab('Untitled tab', null);
    tab.renaming = true;
    state.tabs.push(tab);
    ensureGeneralAccessEntry(tab.id);
    state.activeTabId = tab.id;
    renderTabs();
    renderPage();
    focusRenameInput(tab.id);
  }

  function addSubtab(parentId){
    closeTabMenu();
    const parent = getTab(parentId);
    if(!parent) return;
    const tab = makeTab('Untitled subtab', parentId);
    tab.renaming = true;
    ensureGeneralAccessEntry(tab.id);
    const insertAt = lastDescendantIndex(parentId) + 1;
    state.tabs.splice(insertAt, 0, tab);
    state.activeTabId = tab.id;
    renderTabs();
    renderPage();
    focusRenameInput(tab.id);
  }

  function startRename(id){
    const tab = getTab(id);
    if(!tab) return;
    closeTabMenu();
    tab.renaming = true;
    renderTabs();
    focusRenameInput(id);
  }
  function focusRenameInput(id){
    requestAnimationFrame(()=>{
      const input = el.tabList.querySelector(`input[data-rename="${id}"]`);
      if(input){ input.focus(); input.select(); }
    });
  }
  function commitRename(id, value){
    const tab = getTab(id);
    if(!tab) return;
    const clean = value.trim();
    tab.name = clean || tab.name;
    tab.content.title = tab.name;
    tab.renaming = false;
    renderTabs();
    renderPage();
  }

  function duplicateTab(id){
    closeTabMenu();
    const tab = getTab(id);
    if(!tab) return;
    const copy = JSON.parse(JSON.stringify(tab));
    copy.id = 'tab-' + Math.random().toString(36).slice(2,8);
    copy.name = tab.name + ' (copy)';
    copy.content.title = copy.name;
    copy.comments = [];
    delete copy.renaming;
    delete copy.editedHtml;
    ensureGeneralAccessEntry(copy.id);
    const insertAt = tab.parentId ? state.tabs.indexOf(tab)+1 : lastDescendantIndex(id)+1;
    state.tabs.splice(insertAt, 0, copy);
    renderTabs();
    showToast(`Duplicated "${tab.name}". Sharing settings were not copied.`);
  }

  function deleteTab(id){
    closeTabMenu();
    const tab = getTab(id);
    if(!tab) return;
    const startIdx = state.tabs.indexOf(tab);
    let count = 1;
    if(!tab.parentId){
      while(state.tabs[startIdx+count] && state.tabs[startIdx+count].parentId === tab.id) count++;
    }
    if(state.tabs.length - count < 1){ showToast('A document needs at least one tab.'); return; }
    const removed = state.tabs.splice(startIdx, count);
    deletedStash = {removed, startIdx};
    if(removed.some(t=>t.id===state.activeTabId)){
      const fallback = state.tabs[Math.max(0, startIdx-1)] || state.tabs[0];
      state.activeTabId = fallback.id;
    }
    renderTabs();
    renderPage();
    clearTimeout(deletedTimer);
    const label = removed.length>1 ? `Deleted "${tab.name}" and ${removed.length-1} subtab${removed.length-1>1?'s':''}.` : `Deleted "${tab.name}".`;
    showToast(label, 'Undo', ()=>{
      if(deletedStash){
        state.tabs.splice(deletedStash.startIdx, 0, ...deletedStash.removed);
        state.activeTabId = deletedStash.removed[0].id;
        deletedStash = null;
        renderTabs();
        renderPage();
      }
    });
    deletedTimer = setTimeout(()=>{ deletedStash = null; }, 6000);
  }

  function moveTab(id, dir){
    const tab = getTab(id);
    if(!tab) return;
    const blocks = getBlocks();
    if(tab.parentId){
      const block = blocks.find(b=>b[0].id===tab.parentId);
      if(!block) return;
      const i = block.findIndex(t=>t.id===id);
      const j = i+dir;
      if(j<1 || j>=block.length) return;
      [block[i], block[j]] = [block[j], block[i]];
    } else {
      const bi = blocks.findIndex(b=>b[0].id===id);
      const bj = bi+dir;
      if(bj<0 || bj>=blocks.length) return;
      [blocks[bi], blocks[bj]] = [blocks[bj], blocks[bi]];
    }
    setFromBlocks(blocks);
    renderTabs();
  }

  function moveTabInto(id, targetId){
    const tab = getTab(id);
    if(!tab || tab.id === targetId) return;
    const idx = state.tabs.indexOf(tab);
    state.tabs.splice(idx, 1);
    tab.parentId = targetId;
    const insertAt = lastDescendantIndex(targetId) + 1;
    state.tabs.splice(insertAt, 0, tab);
    closeTabMenu();
    renderTabs();
    showToast(`Moved "${tab.name}" into "${getTab(targetId).name}".`);
  }

  /* ---------- Misc chrome ---------- */
  function toggleStar(){
    state.starred = !state.starred;
    el.starIcon.classList.toggle('filled', state.starred);
    el.starBtn.classList.toggle('on', state.starred);
  }
  function applyZoom(){
    const z = parseFloat(el.zoomSelect.value) || 1;
    el.pageScale.style.transform = `scale(${z})`;
  }
  function toggleToolbar(){
    const collapsed = el.toolbar.classList.toggle('collapsed');
    el.collapseIcon.textContent = collapsed ? 'keyboard_arrow_down' : 'keyboard_arrow_up';
  }

  /* ---------- Event wiring ---------- */
  el.tabList.addEventListener('click', (e)=>{
    const kebabBtn = e.target.closest('[data-kebab]');
    if(kebabBtn){
      e.stopPropagation();
      const id = kebabBtn.dataset.kebab;
      if(state.openMenuTabId === id){ closeTabMenu(); renderTabs(); }
      else { state.openMenuTabId = id; renderTabs(); }
      return;
    }
    const row = e.target.closest('.tab-row');
    if(row && !e.target.closest('input')){ selectTab(row.dataset.tab); }
  });

  el.tabList.addEventListener('dblclick', (e)=>{
    const row = e.target.closest('.tab-row');
    if(row) startRename(row.dataset.tab);
  });

  el.tabList.addEventListener('keydown', (e)=>{
    if(e.target.matches('[data-rename]') && e.key === 'Enter'){ commitRename(e.target.dataset.rename, e.target.value); }
  });
  el.tabList.addEventListener('focusout', (e)=>{
    if(e.target.matches('[data-rename]')){ commitRename(e.target.dataset.rename, e.target.value); }
  });

  document.addEventListener('click', (e)=>{
    if(e.target.closest('.popover')) {
      const emojiBtn = e.target.closest('[data-emoji]');
      if(emojiBtn){
        const tab = getTab(emojiBtn.dataset.id);
        if(tab) tab.emoji = emojiBtn.dataset.emoji;
        closeTabMenu();
        renderTabs();
        return;
      }
      const item = e.target.closest('[data-action]');
      if(item){
        const {action, id, target} = item.dataset;
        const tab = getTab(id);
        if(action === 'share') openShareModal(id);
        if(action === 'rename') startRename(id);
        if(action === 'duplicate') duplicateTab(id);
        if(action === 'delete') deleteTab(id);
        if(action === 'add-subtab') addSubtab(id);
        if(action === 'emoji-toggle') openEmojiPopover(id);
        if(action === 'emoji-clear'){ if(tab) tab.emoji = null; closeTabMenu(); renderTabs(); }
        if(action === 'copy-link'){
          copyToClipboard(`https://docs.example/d/8f3k2q#tab=${id}`);
          closeTabMenu();
          showToast('Link to this tab copied.');
        }
        if(action === 'outline'){ closeTabMenu(); showToast("This tab doesn't have enough headings for an outline yet."); }
        if(action === 'move-up'){ moveTab(id, -1); closeTabMenu(); renderTabs(); }
        if(action === 'move-down'){ moveTab(id, 1); closeTabMenu(); renderTabs(); }
        if(action === 'move-into-toggle') openMoveIntoPopover(id);
        if(action === 'move-into') moveTabInto(id, target);
      }
      return;
    }
    if(!e.target.closest('[data-kebab]') && state.openMenuTabId){ closeTabMenu(); renderTabs(); }
  });

  el.overlay.addEventListener('click', (e)=>{ if(e.target === el.overlay) closeModal(); });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape'){
      if(el.overlay.classList.contains('open')) closeModal();
      else if(state.openMenuTabId){ closeTabMenu(); renderTabs(); }
    }
  });

  el.shareDocBtn.addEventListener('click', ()=> openShareModal('document'));
  el.addTabBtn.addEventListener('click', addTab);
  el.railToggle.addEventListener('click', ()=> el.rail.classList.toggle('rail-open'));
  el.starBtn.addEventListener('click', toggleStar);
  el.zoomSelect.addEventListener('change', applyZoom);
  el.toolbarCollapseBtn.addEventListener('click', toggleToolbar);
  window.addEventListener('hashchange', applyRoute);

  /* ---------- Init ---------- */
  state.tabs.forEach(t=> ensureGeneralAccessEntry(t.id));
  renderTabs();
  renderPage();
  applyRoute();
})();
</script>
